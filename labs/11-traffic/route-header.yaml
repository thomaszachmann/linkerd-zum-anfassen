# Dark Launch: Nur Requests mit dem Header x-canary: true sehen v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bb-route
  namespace: traffic-shift-demo
spec:
  parentRefs:
    - name: bb
      kind: Service
      group: core
      port: 8080
  rules:
    - matches:
        - headers:
            - name: x-canary
              value: "true"
      backendRefs:
        - name: bb-v2
          port: 8080
    - backendRefs:
        - name: bb
          port: 8080
