# Zwei absichtlich schlechte Backends: "flaky" scheitert bei 30 % der Requests,
# "slow" braucht 800 ms. Jedes bekommt einen eigenen Lastgenerator.
apiVersion: v1
kind: Namespace
metadata:
  name: resilienz
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky
  namespace: resilienz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flaky
  template:
    metadata:
      labels:
        app: flaky
    spec:
      containers:
        - name: terminus
          image: buoyantio/bb:v0.0.6
          args: ["terminus", "--h1-server-port=8080", "--percent-failure=30"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flaky
  namespace: resilienz
spec:
  selector:
    app: flaky
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  namespace: resilienz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      containers:
        - name: terminus
          image: buoyantio/bb:v0.0.6
          args: ["terminus", "--h1-server-port=8080", "--sleep-in-millis=800"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: slow
  namespace: resilienz
spec:
  selector:
    app: slow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-flaky
  namespace: resilienz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: last-flaky
  template:
    metadata:
      labels:
        app: last-flaky
    spec:
      containers:
        - name: slow-cooker
          image: buoyantio/slow_cooker:1.3.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              sleep 5
              /slow_cooker/slow_cooker --qps 10 http://flaky:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-slow
  namespace: resilienz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: last-slow
  template:
    metadata:
      labels:
        app: last-slow
    spec:
      containers:
        - name: slow-cooker
          image: buoyantio/slow_cooker:1.3.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              sleep 5
              /slow_cooker/slow_cooker --qps 5 http://slow:8080
