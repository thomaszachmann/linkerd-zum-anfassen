# Ein gesunder und ein kaputter Pod hinter demselben Service.
apiVersion: v1
kind: Namespace
metadata:
  name: circuit-breaking-demo
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good
  namespace: circuit-breaking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      class: good
  template:
    metadata:
      labels:
        class: good
        app: bb
    spec:
      containers:
        - name: terminus
          image: buoyantio/bb:v0.0.6
          args: ["terminus", "--h1-server-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: circuit-breaking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      class: bad
  template:
    metadata:
      labels:
        class: bad
        app: bb
    spec:
      containers:
        - name: terminus
          image: buoyantio/bb:v0.0.6
          args: ["terminus", "--h1-server-port=8080", "--percent-failure=100"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bb
  namespace: circuit-breaking-demo
spec:
  selector:
    app: bb
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-cooker
  namespace: circuit-breaking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-cooker
  template:
    metadata:
      labels:
        app: slow-cooker
    spec:
      containers:
        - name: slow-cooker
          image: buoyantio/slow_cooker:1.3.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              sleep 5
              /slow_cooker/slow_cooker --qps 10 http://bb:8080
