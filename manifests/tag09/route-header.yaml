apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: notes-api-dark, namespace: tag09}
spec:
  parentRefs:
  - {group: "", kind: Service, name: notes-api, port: 80}
  rules:
  - matches:
    - headers: [{name: x-canary, value: "true"}]
    backendRefs:
    - {name: notes-api-v2, port: 80}
  - backendRefs:
    - {name: notes-api, port: 80}
