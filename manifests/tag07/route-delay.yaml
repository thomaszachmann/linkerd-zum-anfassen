apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helper-delay
  namespace: tag07
  annotations:
    timeout.linkerd.io/request: 1s
spec:
  parentRefs:
  - {group: core, kind: Service, name: helper, port: 80}
  rules:
  - matches:
    - path: {type: PathPrefix, value: /delay}
