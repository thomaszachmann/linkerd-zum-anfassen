apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: selfsigned, namespace: tag10}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: lab-ca, namespace: tag10}
spec:
  isCA: true
  commonName: lab-ca.tag10
  secretName: lab-ca
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: lab-ca, namespace: tag10}
spec:
  ca: {secretName: lab-ca}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: notes-tls, namespace: tag10}
spec:
  secretName: notes-tls
  dnsNames: [notes.lab.internal]
  duration: 720h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: lab-ca, kind: Issuer}
