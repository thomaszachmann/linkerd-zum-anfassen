apiVersion: v1
kind: ServiceAccount
metadata: {name: edge, namespace: tag10}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: edge-conf, namespace: tag10}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name notes.lab.internal;
      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      location / {
        proxy_pass http://web.tag10.svc.cluster.local;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge, namespace: tag10}
spec:
  replicas: 1
  selector: {matchLabels: {app: edge}}
  template:
    metadata: {labels: {app: edge}}
    spec:
      serviceAccountName: edge
      containers:
      - name: nginx
        image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine
        ports: [{containerPort: 8443, name: https}]
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d}
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - {name: conf, configMap: {name: edge-conf}}
      - {name: tls, secret: {secretName: notes-tls}}
---
apiVersion: v1
kind: Service
metadata: {name: edge, namespace: tag10}
spec:
  type: NodePort
  selector: {app: edge}
  ports: [{port: 443, targetPort: https, nodePort: 30443, name: https}]
