apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: notes, namespace: tag10}
spec:
  gatewayClassName: cilium
  listeners:
  - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web, namespace: tag10}
spec:
  parentRefs:
  - {name: notes}
  hostnames: [notes.lab.internal]
  rules:
  - backendRefs:
    - {name: web, port: 80}
