apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: notes-api-probe, namespace: tag18}
spec:
  parentRefs:
  - {group: policy.linkerd.io, kind: Server, name: notes-api-http}
  rules:
  - matches:
    - path: {type: Exact, value: /healthz}
      method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata: {name: kubelet, namespace: tag18}
spec:
  networks:
  - cidr: 10.0.0.88/32
  - cidr: 10.0.1.116/32
  - cidr: 10.0.2.241/32
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: {name: notes-api-probe-von-kubelet, namespace: tag18}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: notes-api-probe}
  requiredAuthenticationRefs:
  - {group: policy.linkerd.io, kind: NetworkAuthentication, name: kubelet}
