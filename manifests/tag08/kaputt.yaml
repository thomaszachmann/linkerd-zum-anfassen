apiVersion: v1
kind: ConfigMap
metadata: {name: kaputt-conf, namespace: tag08}
data:
  default.conf: |
    server {
      listen 8080;
      location = /status/200 { return 200 "ok\n"; }
      location / { return 500 "kaputt\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: helper-kaputt, namespace: tag08}
spec:
  replicas: 1
  selector: {matchLabels: {app: helper, variante: kaputt}}
  template:
    metadata: {labels: {app: helper, variante: kaputt}}
    spec:
      serviceAccountName: helper
      containers:
      - name: helper
        image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine
        ports: [{containerPort: 8080, name: http}]
        readinessProbe:
          httpGet: {path: /status/200, port: http}
        volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: conf, configMap: {name: kaputt-conf}}]
