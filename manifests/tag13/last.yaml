apiVersion: v1
kind: ServiceAccount
metadata: {name: last, namespace: tag13}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: last, namespace: tag13}
spec:
  replicas: 1
  selector: {matchLabels: {app: last}}
  template:
    metadata: {labels: {app: last}}
    spec:
      serviceAccountName: last
      containers:
      - name: last
        image: docker.io/curlimages/curl:8.23.0
        env: [{name: ZIEL, value: echo}]
        command: [sh, -c]
        args:
        - |
          while true; do
            r=$(curl -s -m 2 http://$ZIEL/hostname | grep -o "echo-[a-z]*")
            echo "$(date +%T) ${r:-fehler}"
            sleep 0.5
          done
