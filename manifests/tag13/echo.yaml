apiVersion: v1
kind: Namespace
metadata:
  name: tag13
  annotations: {linkerd.io/inject: enabled}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: echo, namespace: tag13}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo-CLUSTER, namespace: tag13}
spec:
  replicas: 1
  selector: {matchLabels: {app: echo}}
  template:
    metadata: {labels: {app: echo}}
    spec:
      serviceAccountName: echo
      containers:
      - name: echo
        image: ghcr.io/mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        readinessProbe:
          httpGet: {path: /status/200, port: http}
---
apiVersion: v1
kind: Service
metadata: {name: echo, namespace: tag13}
spec:
  selector: {app: echo}
  ports: [{port: 80, targetPort: http, name: http}]
