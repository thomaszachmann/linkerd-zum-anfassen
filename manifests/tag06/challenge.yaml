apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: {name: helper-http, namespace: tag06}
spec:
  podSelector: {matchLabels: {app: helper}}
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: helper-get, namespace: tag06}
spec:
  parentRefs:
  - {group: policy.linkerd.io, kind: Server, name: helper-http}
  rules:
  - matches:
    - path: {type: Exact, value: /get}
      method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: {name: fremd, namespace: tag06}
spec:
  identityRefs: [{kind: ServiceAccount, name: fremd}]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: {name: helper-get-von-fremd, namespace: tag06}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: helper-get}
  requiredAuthenticationRefs:
  - {group: policy.linkerd.io, kind: MeshTLSAuthentication, name: fremd}
