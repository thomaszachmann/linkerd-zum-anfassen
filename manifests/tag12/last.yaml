apiVersion: v1
kind: ServiceAccount
metadata: {name: last, namespace: tag12}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: last, namespace: tag12}
spec:
  replicas: 1
  selector: {matchLabels: {app: last}}
  template:
    metadata: {labels: {app: last}}
    spec:
      serviceAccountName: last
      containers:
      - name: last
        image: docker.io/curlimages/curl:8.23.0
        command: [sh, -c]
        args:
        - |
          while true; do
            for p in /get /unstable?failure_rate=0.3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://helper-west$p)
              echo "$(date +%T) ${p%%\?*} $code"
            done
            sleep 1
          done
