apiVersion: apps/v1
kind: Deployment
metadata: {name: helper-v2, namespace: pruefung}
spec:
  replicas: 1
  selector: {matchLabels: {app: helper-v2}}
  template:
    metadata: {labels: {app: helper-v2}}
    spec:
      serviceAccountName: helper
      containers:
      - name: helper
        image: ghcr.io/mccutchen/go-httpbin:2.26.0
        ports: [{containerPort: 8080, name: http}]
        readinessProbe:
          httpGet: {path: /status/200, port: http}
---
apiVersion: v1
kind: Service
metadata: {name: helper-v2, namespace: pruefung}
spec:
  selector: {app: helper-v2}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: {name: helper-v2-http, namespace: pruefung}
spec:
  podSelector: {matchLabels: {app: helper-v2}}
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: {name: helper-v2-von-web, namespace: pruefung}
spec:
  targetRef: {group: policy.linkerd.io, kind: Server, name: helper-v2-http}
  requiredAuthenticationRefs:
  - {group: policy.linkerd.io, kind: MeshTLSAuthentication, name: web}
