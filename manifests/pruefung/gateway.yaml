apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: pruefung, namespace: pruefung}
spec:
  gatewayClassName: cilium
  listeners:
  - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web, namespace: pruefung}
spec:
  parentRefs:
  - {name: pruefung}
  hostnames: [pruefung.lab.internal]
  rules:
  - backendRefs:
    - {name: web, port: 80}
