apiVersion: v1
kind: ServiceAccount
metadata: {name: notes-api, namespace: tag11}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: client, namespace: tag11}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: notes-api, namespace: tag11}
spec:
  replicas: 1
  selector: {matchLabels: {app: notes-api}}
  template:
    metadata:
      labels: {app: notes-api}
      annotations:
        config.linkerd.io/proxy-metrics-hostname-labels: "true"
    spec:
      serviceAccountName: notes-api
      containers:
      - name: notes-api
        image: ghcr.io/thomaszachmann/notes-api:0.7.1
        env:
        - {name: NOTES_API_KEY, value: lab-key-123}
        - {name: NOTES_UPSTREAM, value: https://example.com}
        ports: [{containerPort: 8080, name: http}]
        readinessProbe:
          httpGet: {path: /healthz, port: http}
---
apiVersion: v1
kind: Service
metadata: {name: notes-api, namespace: tag11}
spec:
  selector: {app: notes-api}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: tag11}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata:
      labels: {app: client}
      annotations:
        config.linkerd.io/proxy-metrics-hostname-labels: "true"
    spec:
      serviceAccountName: client
      terminationGracePeriodSeconds: 2
      containers:
      - name: client
        image: docker.io/curlimages/curl:8.23.0
        command: [sleep, infinity]
